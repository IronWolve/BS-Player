[package]
name = "bs-player"
version = "0.9.1"
edition = "2024"
license-file = "LICENSE"
description = "A desktop music and audiobook player with persistent listening progress"
repository = "https://github.com/IronWolve/BS-Player"
readme = "README.md"
rust-version = "1.95"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm", "symphonia-flac", "symphonia-vorbis", "symphonia-ogg", "symphonia-isomp4", "symphonia-aac", "symphonia-alac", "symphonia-aiff"] }
lofty = { version = "=0.22.4", default-features = false }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["ogg", "mkv"] }
symphonia-metadata = "=0.5.5"
opuscule = "=0.2.2"
wsola = "=0.2.0"
rfd = "=0.16.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSImage", "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry", "NSObject", "NSString"] }

[patch.crates-io]
symphonia-format-ogg = { path = "vendor/symphonia-format-ogg" }
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
symphonia-format-mkv = { path = "vendor/symphonia-format-mkv" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
